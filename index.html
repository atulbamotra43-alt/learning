
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #222;
      padding: 25px 15px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card, .form-box, .expense-item {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000c;
    }

    .card h3 {
      color: #666;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card h2 {
      color: #2563eb;
      overflow-wrap: anywhere;
    }

    .form-box {
      margin-bottom: 25px;
    }

    .form-box h2, .history h2 {
      margin-bottom: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    app-button {
      display: block;
    }

    .button-component {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .button-component:hover {
      filter: brightness(0.96);
    }

    .button-component:active {
      transform: translateY(1px);
    }

    .button-component:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .button-component:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .button-component.primary {
      background: #2563eb;
      color: white;
    }

    .button-component.danger {
      width: auto;
      padding: 8px 12px;
      background: #fee2e2;
      color: #b91c1c;
    }

    button {
      cursor: pointer;
    }

    .add-btn {
      margin-top: 12px;
    }

    .search {
      margin-bottom: 15px;
    }

    .expense-list {
      display: grid;
      gap: 12px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .expense-info {
      min-width: 0;
    }

    .expense-info h3 {
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .expense-info p {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
      overflow-wrap: anywhere;
    }

    .amount {
      color: #dc2626;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: right;
    }

    .empty {
      background: white;
      border-radius: 10px;
      text-align: center;
      color: #666;
      padding: 25px;
    }

    @media (max-width: 550px) {
      .summary, .form-grid {
        grid-template-columns: 1fr;
      }

      .expense-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Track your daily expenses easily</p>

    <section class="summary">
      <div class="card">
        <h3>Total Expenses</h3>
        <h2 id="totalAmount">₹0.00</h2>
      </div>

      <div class="card">
        <h3>Total Transactions</h3>
        <h2 id="totalCount">0</h2>
      </div>
    </section>

    <section class="form-box">
      <h2>Add Expense</h2>

      <form id="expenseForm">
        <div class="form-grid">
          <input
            type="text"
            id="title"
            placeholder="Expense name"
            maxlength="100"
            required
          >

          <input
            type="number"
            id="amount"
            placeholder="Amount (₹)"
            min="0.01"
            max="1000000000"
            step="0.01"
            required
          >

          <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>

          <input type="date" id="date" required>
        </div>

        <app-button class="add-btn" variant="primary" type="submit">
          Add Expense
        </app-button>
      </form>
    </section>

    <section class="history">
      <h2>Expense History</h2>

      <input
        class="search"
        type="search"
        id="search"
        placeholder="Search expense or category..."
      >

      <div class="expense-list" id="expenseList"></div>
    </section>
  </main>

  <script>
    // Reusable button component. It keeps button behavior native while
    // allowing each instance to choose a visual variant through attributes.
    class AppButton extends HTMLElement {
      connectedCallback() {
        if (this.querySelector("button")) {
          return;
        }

        const button = document.createElement("button");
        const label = this.textContent.trim();

        button.className = "button-component " +
          (this.getAttribute("variant") || "primary");
        button.type = this.getAttribute("type") || "button";
        button.disabled = this.hasAttribute("disabled");
        button.textContent = label;

        this.replaceChildren(button);
      }
    }

    customElements.define("app-button", AppButton);

    const form = document.getElementById("expenseForm");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const searchInput = document.getElementById("search");
    const expenseList = document.getElementById("expenseList");
    const totalAmount = document.getElementById("totalAmount");
    const totalCount = document.getElementById("totalCount");

    let expenses = [];

    // Load saved data safely
    try {
      const savedExpenses = JSON.parse(
        localStorage.getItem("expenseTrackerData") || "[]"
      );

      if (Array.isArray(savedExpenses)) {
        expenses = savedExpenses.filter(function(expense) {
          return expense &&
            typeof expense.id === "string" &&
            typeof expense.title === "string" &&
            typeof expense.category === "string" &&
            typeof expense.date === "string" &&
            Number.isFinite(expense.amount) &&
            expense.amount > 0;
        });
      }
    } catch (error) {
      expenses = [];
    }

    // Format currency
    function formatMoney(amount) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR"
      }).format(amount);
    }

    // Save data
    function saveExpenses() {
      try {
        localStorage.setItem(
          "expenseTrackerData",
          JSON.stringify(expenses)
        );
      } catch (error) {
        alert("Unable to save data in this browser.");
      }
    }

    // Update summary cards
    function updateSummary() {
      const total = expenses.reduce(function(sum, expense) {
        return sum + expense.amount;
      }, 0);

      totalAmount.textContent = formatMoney(total);
      totalCount.textContent = expenses.length;
    }

    // Create a safe text element
    function makeElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;

      if (className) {
        element.className = className;
      }

      return element;
    }

    // Display expenses
    function renderExpenses() {
      expenseList.replaceChildren();

      const query = searchInput.value.trim().toLowerCase();

      const filtered = expenses.filter(function(expense) {
        return expense.title.toLowerCase().includes(query) ||
          expense.category.toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        expenseList.appendChild(
          makeElement("p", "No expenses found.", "empty")
        );
        return;
      }

      filtered.forEach(function(expense) {
        const item = document.createElement("article");
        item.className = "expense-item";

        const info = document.createElement("div");
        info.className = "expense-info";

        info.appendChild(makeElement("h3", expense.title));
        info.appendChild(makeElement("p", "Category: " + expense.category));
        info.appendChild(makeElement("p", "Date: " + expense.date));

        const right = document.createElement("div");

        right.appendChild(
          makeElement("p", formatMoney(expense.amount), "amount")
        );

        const deleteButton = document.createElement("app-button");
        deleteButton.setAttribute("variant", "danger");
        deleteButton.setAttribute("type", "button");
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function() {
          deleteExpense(expense.id);
        });

        right.appendChild(deleteButton);
        item.append(info, right);
        expenseList.appendChild(item);
      });
    }

    // Add expense
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      const amount = Number(amountInput.value);
      const category = categoryInput.value;
      const date = dateInput.value;

      if (!title || !category || !date) {
        alert("Please fill in all fields.");
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("Please enter a valid amount greater than zero.");
        return;
      }

      if (amount > 1000000000) {
        alert("Amount is too large.");
        return;
      }

      const expense = {
        id: crypto.randomUUID(),
        title: title,
        amount: Math.round(amount * 100) / 100,
        category: category,
        date: date
      };

      expenses.unshift(expense);
      saveExpenses();
      updateSummary();
      renderExpenses();

      form.reset();
      titleInput.focus();
    });

    // Delete expense
    function deleteExpense(id) {
      expenses = expenses.filter(function(expense) {
        return expense.id !== id;
      });

      saveExpenses();
      updateSummary();
      renderExpenses();
    }


    // Filter expenses as the user searches
    searchInput.addEventListener("input", renderExpenses);

    // Initialize the page
    updateSummary();
    renderExpenses();
  </script>
</body>
</html>
